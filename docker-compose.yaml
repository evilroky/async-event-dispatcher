services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-dispatcher-app
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - DB_HOST=event-dispatcher-postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-notifications}
      - KAFKA_BROKERS=event-dispatcher-kafka:29092
      - REDIS_ADDR=event-dispatcher-redis:6379
    depends_on:
      - postgres
      - kafka
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: event-dispatcher-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notifications}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: event-dispatcher-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: event-dispatcher-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://event-dispatcher-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: event-dispatcher-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  pgdata: